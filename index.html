<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b1210" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Static</title>
  <style>
    :root{--ink:#eef3ea;--muted:#9aab9e;--line:rgba(238,243,234,.12);--safeb:env(safe-area-inset-bottom,16px);--safet:env(safe-area-inset-top,8px)}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    body{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;background:#0b1210;color:var(--ink);overflow:hidden}
    button,input{font-family:inherit}
    button{cursor:pointer;-webkit-tap-highlight-color:transparent;border:0}
    input{width:100%;background:#15201c;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;margin:6px 0 12px}
    #app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:#0b1210}
    .hud{z-index:8;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:calc(8px + var(--safet)) 14px 8px;background:rgba(11,18,16,.94);border-bottom:1px solid var(--line)}
    .hud[hidden]{display:none!important}
    .bar>i{width:0}
    .stat{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
    .stat b{display:block;font-size:15px;color:var(--ink);text-transform:none;letter-spacing:0;margin:2px 0 5px}
    .bar{height:7px;background:#24332e;border-radius:99px;overflow:hidden}
    .bar>i{display:block;height:100%}
    .e>i{background:#d4e07a}.f>i{background:#7ec8c0}.p>i{background:#e8a07a}
    #med{grid-column:1/-1;font-size:11px;color:var(--muted)}
    #clock{cursor:pointer;text-decoration:underline dotted rgba(238,243,234,.35)}
    #stage{flex:1;overflow-y:auto;padding:16px 16px calc(18px + var(--safeb))}
    h1{font-family:ui-serif,Georgia,serif;font-size:34px;margin:8px 0}
    h2{font-family:ui-serif,Georgia,serif;font-size:22px;margin:0 0 10px}
    p{color:#d7e0d4;line-height:1.5;margin-bottom:10px}
    .kicker{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
    .tiny{font-size:12px;color:var(--muted);line-height:1.45}
    .card{background:#15201c;border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .btn{display:block;width:100%;text-align:left;background:#1b2824;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:16px;margin-top:8px}
    .btn.main{border-color:rgba(212,224,122,.45)}
    .btn:disabled{opacity:.35}
    #hold{width:100%;height:110px;border-radius:20px;border:1px solid rgba(126,200,192,.45);background:#13221e;color:var(--ink);font-size:18px;font-weight:650;margin:8px 0 12px}
    #hold.down{background:#1c3a32}
    #hold.locked{border-color:rgba(232,160,122,.6);opacity:.45}
    .prog{height:10px;background:#24332e;border-radius:99px;overflow:hidden;margin:6px 0 14px}
    .prog>i{display:block;height:100%;width:0;background:#7ec8c0}
    .task{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
    .task.main{color:#ffe7a8}
    .task button{background:#1b2824;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px}
    #bubbles{position:fixed;inset:0;pointer-events:none;z-index:6;max-width:480px;margin:0 auto}
    .bubble{position:absolute;pointer-events:auto;width:120px;padding:8px;border-radius:999px;background:rgba(40,22,22,.94);border:1px solid rgba(232,160,122,.5);color:#f3d2c4;font-size:11px;line-height:1.2;text-align:center;overflow:hidden}
    .bubble.work{background:rgba(20,36,34,.94);border-color:rgba(126,200,192,.5);color:#d7efea}
    .bubble.home{background:rgba(36,28,18,.94);border-color:rgba(255,215,130,.5);color:#ffe7a8;width:140px}
    .bubble.boss{width:168px;min-height:92px;padding:12px;font-size:13px;font-weight:650;color:#ffe8dc;background:rgba(48,16,16,.96);border:2px solid #e8a07a;z-index:9;border-radius:40% 60% 55% 45% / 45% 40% 60% 55%;animation:bossIdle 2.4s ease-in-out infinite}
    .bubble.boss.hit{animation:bossHit .35s ease-out}
    @keyframes bossIdle{0%{border-radius:40% 60% 55% 45% / 45% 40% 60% 55%}50%{border-radius:60% 40% 35% 65% / 55% 60% 40% 45%}100%{border-radius:40% 60% 55% 45% / 45% 40% 60% 55%}}
    @keyframes bossHit{0%{border-radius:50%;transform:scale(1.06)}40%{border-radius:70% 30% 65% 35% / 30% 70% 35% 65%;transform:scale(1.12)}100%{border-radius:20% 80% 30% 70% / 80% 20% 70% 30%;transform:scale(1)}}
    #shame{position:fixed;inset:0;pointer-events:none;z-index:12;transition:background .2s}
    #shame.on{background:rgba(20,8,8,.45)}
    #cur.flash{animation:steal .7s ease}
    @keyframes steal{0%{color:#ffe7a8}40%{color:#e8a07a}100%{color:var(--ink)}}
    .popup{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:30}
    .popup.show{display:flex}
    .sheet{width:100%;max-width:480px;background:#17241f;border-radius:20px 20px 0 0;padding:20px 16px calc(18px + var(--safeb))}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
    .grid div{background:#1b2824;border-radius:12px;padding:12px;font-size:12px;color:var(--muted)}
    .grid b{display:block;color:var(--ink);font-size:20px;font-family:ui-serif,Georgia,serif}
    .times{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  </style>
</head>
<body>
<div id="app">
  <div class="hud" id="hud" hidden>
    <div class="stat"><b id="clock">????</b>Energy<div class="bar e"><i id="eBar"></i></div></div>
    <div class="stat"><b>Focus</b><div class="bar f"><i id="fBar"></i></div></div>
    <div class="stat"><b>Their patience</b><div class="bar p"><i id="pBar"></i></div></div>
    <div id="med">meds: —</div>
  </div>
  <div id="stage"></div>
</div>
<div id="shame"></div>
<div class="popup" id="popup"></div>
<div id="bubbles"></div>
<script>
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const mil=m=>{const x=((Math.floor(m)%1440)+1440)%1440;return String(Math.floor(x/60)).padStart(2,"0")+String(x%60).padStart(2,"0")};
const lateThoughts=["Already behind.","Don't look.","Look at the clock.","They think you don't care.","Just start.","This should be easy.","You'll stay late.","One more minute.","You forgot something.","Why is this hard."];
const workAsks=["Can you just…","Two minutes.","Forwarding this.","Got a sec?"];
const bossLines=["Status on the main thing.","I asked about this.","Even if it's done I need it again.","Why isn't this closed.","Walk me through it. Now."];
const homeLines=["You leaving?","Still there?","Dinner's ready.","Can you pick up."];
let S,loop=0,holding=false,bubbles=[],raf=0,scene="setup",glance=true;
const clockEl=document.getElementById("clock"),eBar=document.getElementById("eBar"),fBar=document.getElementById("fBar"),pBar=document.getElementById("pBar"),med=document.getElementById("med");
clockEl.onclick=()=>{if(!S||scene!=="desk")return;glance=true;clockEl.textContent=mil(S.time);S.focus=clamp(S.focus-2,0,100)};
function fresh(form){return{name:form.name||"You",job:form.job||"work",home:form.home||"someone at home",start:form.start??8*60,end:form.end??17*60,important:form.important||"The one thing that actually matters",meds:!!form.meds,medOn:!!form.meds,time:form.wake??7*60,energy:62,focus:36,patience:70,peach:0,interrupts:0,started:0,done:0,working:0,tasks:[],off:false,coffee:2,pills:form.meds?1:0,lockUntil:0,holdSecs:0,waveT:16,boss:null,bossLeft:2,nextBoss:28,vanish:null,shameT:34,switchT:20,stuck:new Set(),weather:"clear",heldLong:0}}
function hud(){if(document.getElementById("hud").hidden)return;clockEl.textContent=glance?mil(S.time):"????";eBar.style.width=S.energy+"%";fBar.style.width=S.focus+"%";pBar.style.width=S.patience+"%";med.textContent=S.meds?(S.medOn?"meds: holding":"meds: crashed"):"meds: none"}
function weather(){if(!S.meds){S.medOn=false;return}if(S.time>=S.start+6*60)S.medOn=Math.random()>0.7;else if(S.time>=S.start+2*60)S.medOn=Math.random()>0.45;else S.medOn=true}
function addTask(title,kind){if(!S||S.tasks.some(t=>t.title===title))return;S.tasks.push({title,kind:kind||"side",prog:0,open:true,hidden:false});S.started++;renderTasks()}
function renderTasks(){const box=document.getElementById("taskbox");if(!box||!S)return;const rows=S.tasks.filter(t=>t.open&&!t.hidden);box.innerHTML=rows.map(t=>{const i=S.tasks.indexOf(t);return '<div class="task '+(t.kind==="main"?"main":"")+'"><span>'+t.title+'<div class="tiny">'+Math.floor(t.prog)+'% · '+(t.kind==="main"?"THE thing":t.kind)+(S.stuck.has(i)?" · stuck":"")+'</div></span><button type="button" onclick="pickTask('+i+')">'+(S.working===i?"Current":"Work")+"</button></div>"}).join("")||'<div class="tiny">No open Taskers. (or they slipped)</div>'}
function pickTask(i){if(!S.tasks[i]||S.tasks[i].hidden)return;if(S.working!==i)S.focus=clamp(S.focus-14,0,100);S.working=i;S.holdSecs=0;S.lockUntil=0;const cur=document.getElementById("cur");if(cur)cur.textContent=S.tasks[i].title;renderTasks();hud()}
function closeWorking(){const t=S.tasks[S.working];if(!t||!t.open)return;t.open=false;t.prog=100;S.done++;S.working=S.tasks.findIndex(x=>x.open&&!x.hidden);const cur=document.getElementById("cur");if(cur)cur.textContent=S.working>=0?S.tasks[S.working].title:"Clear";renderTasks()}
function spawn(text,kind){const host=document.getElementById("app").getBoundingClientRect();const layer=document.getElementById("bubbles");if(!layer)return;const el=document.createElement("button");el.type="button";el.className="bubble"+(kind==="work"?" work":kind==="home"?" home":kind==="boss"?" boss":"");el.textContent=kind==="boss"?text+"  ·  6 taps":text;layer.appendChild(el);const w=kind==="boss"?168:kind==="home"?140:120;const b={el,kind,text,x:10+Math.random()*Math.max(20,host.width-w-20),y:kind==="boss"?160:90+Math.random()*Math.max(60,host.height-240),vx:(0.7+Math.random())*(Math.random()>.5?1:-1),vy:(0.7+Math.random())*(Math.random()>.5?1:-1)};el.style.left=b.x+"px";el.style.top=b.y+"px";el.onclick=e=>{e.stopPropagation();if(kind==="boss"){if(!S.boss)return;S.boss.hits++;el.classList.remove("hit");void el.offsetWidth;el.classList.add("hit");el.textContent=text+"  ·  "+(S.boss.need-S.boss.hits)+" taps";S.focus=clamp(S.focus-3,0,100);S.time+=1;if(S.boss.hits>=S.boss.need){el.remove();bubbles=bubbles.filter(x=>x!==b);S.boss=null;S.weather="clear";lockHold();toast("They're gone. For now.")}hud();return}if(kind==="late"){S.peach++;S.time+=S.peach===1?1:Math.min(10,S.peach*2);S.focus=clamp(S.focus-5,0,100);holding=false;if(S.peach===1)toast("Looking at the thought is the tax.")}else if(kind==="home"){S.time+=4;S.patience=clamp(S.patience-6,0,100);holding=false}else if(!S.off){S.interrupts++;S.time+=5+Math.floor(Math.random()*8);S.focus=clamp(S.focus-12,0,100);S.patience=clamp(S.patience-4,0,100);addTask(text,"interrupt");holding=false}el.remove();bubbles=bubbles.filter(x=>x!==b);setTimeout(function(){if(scene==="desk"&&kind!=="boss"&&!(kind==="work"&&S.off)&&kind!=="home")spawn(text,kind)},kind==="work"?16000:900);hud()};bubbles.push(b);if(kind==="boss")lockHold()}
function tickBubbles(){const host=document.getElementById("app").getBoundingClientRect();const extra=S?S.tasks.filter(t=>t.open).length:0;const crash=S&&S.meds&&!S.medOn?1.35:1;const sp=(1.2+extra*0.2)*crash;bubbles.forEach(b=>{const m=b.kind==="late"?sp:b.kind==="boss"?0.85:1;b.x+=b.vx*m;b.y+=b.vy*m;const w=b.el.offsetWidth||120,h=b.el.offsetHeight||48;if(b.x<6||b.x>host.width-w-6)b.vx*=-1;if(b.y<78||b.y>host.height-h-16)b.vy*=-1;b.x=clamp(b.x,6,Math.max(6,host.width-w-6));b.y=clamp(b.y,78,Math.max(78,host.height-h-16));b.el.style.left=b.x+"px";b.el.style.top=b.y+"px"});raf=requestAnimationFrame(tickBubbles)}
function clearBubbles(){cancelAnimationFrame(raf);raf=0;bubbles.forEach(b=>b.el.remove());bubbles=[]}
function toast(html){const p=document.getElementById("popup");p.innerHTML='<div class="sheet"><p>'+html+'</p><button class="btn main" type="button" onclick="document.getElementById(\'popup\').classList.remove(\'show\')">Ok</button></div>';p.classList.add("show")}
function parseHM(v,fb){if(!v||!v.includes(":"))return fb;const p=v.split(":");return (+p[0])*60+(+p[1])}
function lockHold(){const btn=document.getElementById("hold");if(!btn)return;const blocked=!!(S&&S.boss)||performance.now()<(S&&S.lockUntil||0);btn.disabled=blocked;btn.classList.toggle("locked",blocked);btn.textContent=S&&S.boss?"Deal with them first":(blocked?"Stuck on this":"Hold to focus")}
function sip(){if(!S||S.coffee<=0)return;S.coffee--;S.energy=clamp(S.energy+28,0,100);S.focus=clamp(S.focus+6,0,100);toast("Coffee. Tasks will move until it doesn't.")}
function pill(){if(!S||!S.meds||S.pills<=0)return;S.pills--;S.medOn=true;S.energy=clamp(S.energy+18,0,100);S.focus=clamp(S.focus+10,0,100);toast("Onboard. Weather still changes later.")}
function wave(){if(scene!=="desk")return;const n=3+Math.min(6,S.tasks.filter(t=>t.open).length);for(let i=0;i<n;i++)setTimeout(function(){if(scene==="desk")spawn(lateThoughts[Math.floor(Math.random()*lateThoughts.length)],"late")},i*90)}
function callBoss(){if(S.boss||S.bossLeft<=0||scene!=="desk")return;S.bossLeft--;S.boss={hits:0,need:6};S.weather="boss";spawn(bossLines[Math.floor(Math.random()*bossLines.length)],"boss");S.patience=clamp(S.patience-8,0,100);holding=false;lockHold()}
function show(id){scene=id;clearBubbles();holding=false;const st=document.getElementById("stage");if(id==="setup"){document.getElementById("hud").hidden=true;st.innerHTML='<div class="kicker">ADHD desk sim</div><h1>Static</h1><p>Not a diagnosis. Time lies unless you tap the clock. Tasks wander. Closing the last percent is the tax.</p><label class="tiny">Your name</label><input id="nm" placeholder="Alex" /><label class="tiny">What you do all day</label><input id="jb" placeholder="nurse, student, dispatcher" /><label class="tiny">Who is waiting after work</label><input id="hm" placeholder="partner, roommate, kids" /><label class="tiny">The one thing that actually matters today</label><input id="imp" placeholder="Finish the report" /><label class="tiny">Wake · start · end</label><div class="times"><input id="wk" type="time" value="06:30" /><input id="stt" type="time" value="08:00" /><input id="en" type="time" value="17:00" /></div><label class="tiny"><input type="checkbox" id="md" style="width:auto;display:inline;margin-right:8px" />I take stimulant meds</label><button class="btn main" type="button" onclick="begin()">Start the day</button><p class="tiny">Tap the clock to see it. Keep clicking THE thing. Coffee/meds spend charges.</p>';return}if(id==="desk"){document.getElementById("hud").hidden=false;st.innerHTML='<div class="kicker">'+S.job+' · hold to work</div><h2 id="cur">'+S.important+'</h2><div class="prog"><i id="pfill"></i></div><button id="hold" type="button">Hold to focus</button><div class="row"><button class="btn" type="button" id="coffeeBtn">Coffee</button><button class="btn" type="button" id="medBtn">Meds</button></div><p class="tiny">Clock is a guess until you tap it. The list will steal you.</p><div class="card"><div class="kicker">Taskers</div><div id="taskbox"></div></div><button class="btn" type="button" onclick="show(\'end\')">End the day</button>';document.getElementById("coffeeBtn").onclick=sip;document.getElementById("medBtn").onclick=pill;if(!S.meds)document.getElementById("medBtn").disabled=true;bindHold();renderTasks();lateThoughts.sort(function(){return Math.random()-.5}).slice(0,5).forEach(function(t){spawn(t,"late")});workAsks.slice(0,2).forEach(function(t){spawn(t,"work")});tickBubbles();startLoop();hud();lockHold();return}if(id==="end"){const main=S.tasks.find(function(t){return t.kind==="main"});st.innerHTML='<div class="kicker">After</div><h2>'+(main&&main.prog>=100?"The thing got done. The cost is below.":"The thing did not finish. That is the usual ending.")+'</h2><p>'+S.name+" did "+S.job+". "+S.home+" got whoever arrived at "+mil(S.time)+'.</p><div class="grid"><div><b>'+S.done+"</b>closed</div><div><b>"+S.started+"</b>opened</div><div><b>"+S.interrupts+"</b>hallway asks</div><div><b>"+S.peach+'</b>thought taps</div></div><p class="tiny">Not medical advice.</p><button class="btn main" type="button" onclick="show(\'setup\')">New person</button>'}}
function begin(){S=fresh({name:document.getElementById("nm").value.trim(),job:document.getElementById("jb").value.trim(),home:document.getElementById("hm").value.trim(),important:document.getElementById("imp").value.trim(),wake:parseHM(document.getElementById("wk").value,6*60+30),start:parseHM(document.getElementById("stt").value,8*60),end:parseHM(document.getElementById("en").value,17*60),meds:document.getElementById("md").checked});S.tasks=[];S.started=0;addTask(S.important,"main");addTask("Inbox that will not zero","side");addTask("Something promised yesterday","side");S.working=0;glance=false;show("desk")}
function bindHold(){const btn=document.getElementById("hold");if(!btn)return;const on=function(e){e.preventDefault();if(S.boss||performance.now()<S.lockUntil)return;holding=true;btn.classList.add("down")};const off=function(){if(holding&&S&&S.heldLong>2.2){S.time+=6+Math.floor(Math.random()*8);glance=false}S.heldLong=0;holding=false;btn.classList.remove("down");hud()};btn.addEventListener("pointerdown",on);btn.addEventListener("pointerup",off);btn.addEventListener("pointercancel",off);btn.addEventListener("pointerleave",off)}
function startLoop(){cancelAnimationFrame(loop);let last=performance.now();const step=function(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(scene!=="desk"||!S)return;S.time+=dt*2.6;S.waveT-=dt;S.shameT-=dt;S.switchT-=dt;S.nextBoss-=dt;if(S.time>=S.start+2*60)weather();if(S.weather==="clear"&&S.waveT<=0){wave();S.weather="wave";setTimeout(function(){if(S.weather==="wave")S.weather="clear"},4000);S.waveT=22+Math.random()*10}if(S.weather==="clear"&&S.shameT<=0){document.getElementById("shame").classList.add("on");holding=false;S.weather="shame";S.focus=clamp(S.focus-8,0,100);S.patience=clamp(S.patience-5,0,100);setTimeout(function(){document.getElementById("shame").classList.remove("on");if(S.weather==="shame")S.weather="clear"},900);S.shameT=36+Math.random()*18}if(S.weather==="clear"&&S.switchT<=0){const opts=S.tasks.map(function(t,i){return t.open&&!t.hidden?i:-1}).filter(function(i){return i>=0&&i!==S.working});if(opts.length){S.working=opts[Math.floor(Math.random()*opts.length)];S.holdSecs=0;const cur=document.getElementById("cur");if(cur){cur.textContent="Now on: "+S.tasks[S.working].title;cur.classList.remove("flash");void cur.offsetWidth;cur.classList.add("flash")}renderTasks()}S.switchT=18+Math.random()*10}if(S.weather==="clear"&&S.nextBoss<=0){callBoss();S.nextBoss=55+Math.random()*25}if(S.weather==="clear"&&!S.vanish&&Math.random()<0.0012){const side=S.tasks.find(function(t){return t.open&&t.kind!=="main"&&!t.hidden});if(side){side.hidden=true;S.vanish=side;renderTasks()}}else if(S.vanish&&Math.random()<0.002){S.vanish.hidden=false;toast("You forgot this was open: "+S.vanish.title);S.time+=7;S.vanish=null;renderTasks()}if(S.off&&Math.random()<0.01)spawn(homeLines[Math.floor(Math.random()*homeLines.length)],"home");const locked=performance.now()<S.lockUntil;if(holding&&!S.boss&&!locked&&S.working>=0){const t=S.tasks[S.working];S.holdSecs+=dt;S.heldLong+=dt;if(t&&t.kind!=="main"&&S.holdSecs>7){S.lockUntil=performance.now()+3500;holding=false;lockHold();toast("Hyperfocus. You cannot drop the wrong thing yet.")}if(t&&t.open){const juice=(S.energy<8?3.2:(S.medOn?16:10))*(S.focus/100)*(0.45+S.energy/140);let add=juice*dt;if(t.prog>=94&&t.prog<100){S.stuck.add(S.working);if(!(holding&&bubbles.filter(function(b){return b.kind==="late"}).length<=3))add*=0.12}t.prog=clamp(t.prog+add,0,100);S.focus=clamp(S.focus+(S.medOn?4:1)*dt,0,100);S.energy=clamp(S.energy-(S.energy<8?1.2:3)*dt,0,100);if(t.prog>=100){S.stuck.delete(S.working);closeWorking()}}}else{S.focus=clamp(S.focus-5*dt,0,100);S.energy=clamp(S.energy-0.6*dt,0,100);S.tasks.forEach(function(t){if(t.open&&t.kind!=="main")t.prog=Math.max(0,t.prog-1.2*dt)})}if(S.time>=S.end&&!S.off){S.off=true;toast(S.home+" is the clock now.")}if(S.time>=S.end+180){show("end");return}const t=S.tasks[S.working],fill=document.getElementById("pfill");if(fill&&t)fill.style.width=t.prog+"%";lockHold();const cb=document.getElementById("coffeeBtn"),mb=document.getElementById("medBtn");if(cb)cb.textContent="Coffee ("+S.coffee+" left)";if(mb)mb.textContent="Meds ("+S.pills+" left)";hud();loop=requestAnimationFrame(step)};loop=requestAnimationFrame(step)}
show("setup");
</script>
</body>
</html>
