<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0b1210" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Static" />
  <title>Static</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    :root{--ink:#eef3ea;--muted:#9aab9e;--line:rgba(238,243,234,.12);--safeb:env(safe-area-inset-bottom,16px);--safet:env(safe-area-inset-top,8px)}
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
    body{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;background:#0b1210;color:var(--ink);overflow:hidden}
    button,input{font-family:inherit}
    button{cursor:pointer;-webkit-tap-highlight-color:transparent;border:0}
    input{width:100%;background:#15201c;color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;margin:6px 0 12px}
    #app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:#0b1210}
    canvas#phys{position:absolute;inset:0;width:100%;height:100%;z-index:5}
    .hud{position:relative;z-index:8;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:calc(8px + var(--safet)) 14px 8px;background:rgba(11,18,16,.94);border-bottom:1px solid var(--line);-webkit-user-select:none;user-select:none}
    .stat{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
    .stat b{display:block;font-size:15px;color:var(--ink);text-transform:none;letter-spacing:0;margin:2px 0 5px}
    .bar{height:7px;background:#24332e;border-radius:99px;overflow:hidden}
    .bar>i{display:block;height:100%}
    .e>i{background:#d4e07a}.f>i{background:#7ec8c0}.p>i{background:#e8a07a}
    #med{grid-column:1/-1;font-size:11px;color:var(--muted)}
    #stage{flex:1;overflow-y:auto;padding:16px 16px calc(18px + var(--safeb));position:relative;z-index:6;pointer-events:none}
    #stage input,#stage button,#stage .card,#stage .btn,#hold{pointer-events:auto;position:relative;z-index:7}
    #stage h1,#stage h2,#stage p,#stage .kicker,#stage .tiny,#stage label{pointer-events:none}
    h1{font-family:ui-serif,Georgia,serif;font-size:34px;margin:8px 0}
    h2{font-family:ui-serif,Georgia,serif;font-size:22px;margin:0 0 10px}
    p{color:#d7e0d4;line-height:1.5;margin-bottom:10px}
    .kicker{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
    .tiny{font-size:12px;color:var(--muted);line-height:1.45}
    .card{background:rgba(21,32,28,.92);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
    .btn{display:block;width:100%;text-align:left;background:#1b2824;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:16px;margin-top:8px}
    .btn.main{border-color:rgba(212,224,122,.45)}
    #hold{width:100%;height:110px;border-radius:20px;border:1px solid rgba(126,200,192,.45);background:rgba(19,34,30,.92);color:var(--ink);font-size:18px;font-weight:650;margin:8px 0 12px}
    #hold.down{background:#1c3a32}
    .prog{height:10px;background:#24332e;border-radius:99px;overflow:hidden;margin:6px 0 14px}
    .prog>i{display:block;height:100%;width:0;background:#7ec8c0}
    .task{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
    .task.main{color:#ffe7a8}
    .task button{background:#1b2824;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px}
    .popup{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center;z-index:30}
    .popup.show{display:flex}
    .sheet{width:100%;max-width:480px;background:#17241f;border-radius:20px 20px 0 0;padding:20px 16px calc(18px + var(--safeb))}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
    .grid div{background:#1b2824;border-radius:12px;padding:12px;font-size:12px;color:var(--muted)}
    .grid b{display:block;color:var(--ink);font-size:20px;font-family:ui-serif,Georgia,serif}
    .times{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  </style>
</head>
<body>
<div id="app">
  <canvas id="phys"></canvas>
  <div class="hud" id="hud" hidden>
    <div class="stat"><b id="clock">0700</b>Energy<div class="bar e"><i id="eBar"></i></div></div>
    <div class="stat"><b>Focus</b><div class="bar f"><i id="fBar"></i></div></div>
    <div class="stat"><b>Their patience</b><div class="bar p"><i id="pBar"></i></div></div>
    <div id="med">meds: —</div>
  </div>
  <div id="stage"></div>
</div>
<div class="popup" id="popup"></div>
<script>
const {Engine, World, Bodies, Body, Events, Query} = Matter;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const mil=m=>{const x=((Math.floor(m)%1440)+1440)%1440;return String(Math.floor(x/60)).padStart(2,"0")+String(x%60).padStart(2,"0")};
const lateThoughts=["You're already behind.","Don't look at the clock.","Look at the clock.","They think you don't care.","Start. Just start.","This should be easy.","You'll stay late.","One more minute.","You forgot something."];
const workAsks=["Can you just look at this?","Quick question. Two minutes.","Forwarding this to you.","Got a sec?"];
let S, loop=0, holding=false, scene="setup";
let engine, world, holdBody=null, balls=[];
const canvas=document.getElementById("phys");
const ctx=canvas.getContext("2d");
const clockEl=document.getElementById("clock"), eBar=document.getElementById("eBar"), fBar=document.getElementById("fBar"), pBar=document.getElementById("pBar"), med=document.getElementById("med");
let view={w:320,h:640};
function sizeCanvas(){
  const r=document.getElementById("app").getBoundingClientRect();
  const d=Math.min(2,window.devicePixelRatio||1);
  canvas.width=r.width*d; canvas.height=r.height*d;
  canvas.style.width=r.width+"px"; canvas.style.height=r.height+"px";
  ctx.setTransform(d,0,0,d,0,0);
  view={w:r.width,h:r.height};
  return view;
}
function fresh(form){
  return {
    name:form.name||"You", job:form.job||"work", home:form.home||"someone at home",
    start:form.start??8*60, end:form.end??17*60,
    important:form.important||"The one thing that actually matters",
    meds:!!form.meds, medOn:!!form.meds,
    time:form.wake??7*60, energy:62, focus:36, patience:70,
    peach:0, interrupts:0, started:0, done:0, working:0, tasks:[], off:false
  };
}
function hud(){
  if(document.getElementById("hud").hidden)return;
  clockEl.textContent=mil(S.time);
  eBar.style.width=S.energy+"%"; fBar.style.width=S.focus+"%"; pBar.style.width=S.patience+"%";
  med.textContent=S.meds?(S.medOn?"meds: holding":"meds: missing / crashed"):"meds: none";
}
function weather(){
  if(!S.meds){S.medOn=false;return}
  if(S.time>=S.start+6*60) S.medOn=Math.random()>0.65;
  else if(S.time>=S.start+2*60) S.medOn=Math.random()>0.4;
  else S.medOn=true;
}
function addTask(title,kind){
  if(S.tasks.some(t=>t.title===title))return;
  S.tasks.push({title,kind:kind||"side",prog:0,open:true});
  S.started++; renderTasks();
}
function renderTasks(){
  const box=document.getElementById("taskbox");
  if(!box)return;
  box.innerHTML=S.tasks.filter(t=>t.open).map(t=>{
    const i=S.tasks.indexOf(t);
    return `<div class="task ${t.kind==="main"?"main":""}"><span>${t.title}<div class="tiny">${Math.floor(t.prog)}% · ${t.kind==="main"?"THE thing":t.kind}</div></span><button type="button" onclick="pickTask(${i})">${S.working===i?"Current":"Work"}</button></div>`;
  }).join("")||`<div class="tiny">No open Taskers.</div>`;
}
function pickTask(i){
  if(S.working!==i) S.focus=clamp(S.focus-14,0,100);
  S.working=i;
  const t=S.tasks[i], cur=document.getElementById("cur");
  if(cur) cur.textContent=t?t.title:"—";
  renderTasks(); hud();
}
function closeWorking(){
  const t=S.tasks[S.working];
  if(!t||!t.open)return;
  t.open=false; t.prog=100; S.done++;
  S.working=S.tasks.findIndex(x=>x.open);
  const cur=document.getElementById("cur");
  if(cur) cur.textContent=S.working>=0?S.tasks[S.working].title:"Clear";
  renderTasks();
}
function toast(html){
  const p=document.getElementById("popup");
  p.innerHTML=`<div class="sheet"><p>${html}</p><button class="btn main" type="button" onclick="document.getElementById('popup').classList.remove('show')">Ok</button></div>`;
  p.classList.add("show");
}
function parseHM(v,fb){if(!v||!v.includes(":"))return fb;const[h,m]=v.split(":").map(Number);return h*60+m}
function bootPhysics(){
  if(engine){ World.clear(world,false); Engine.clear(engine); }
  engine=Engine.create({gravity:{x:0,y:0},enableSleeping:false});
  world=engine.world;
  const {w,h}=sizeCanvas();
  World.add(world,[
    Bodies.rectangle(w/2,-20,w,40,{isStatic:true}),
    Bodies.rectangle(w/2,h+20,w,40,{isStatic:true}),
    Bodies.rectangle(-20,h/2,40,h,{isStatic:true}),
    Bodies.rectangle(w+20,h/2,40,h,{isStatic:true})
  ]);
  holdBody=Bodies.rectangle(w/2,h*0.42,Math.min(400,w-32),90,{isStatic:true,label:"hold",chamfer:{radius:16}});
  World.add(world,holdBody);
  balls=[];
  Events.on(engine,"collisionStart",e=>{
    e.pairs.forEach(pair=>{
      const labels=[pair.bodyA.label,pair.bodyB.label];
      if(!labels.includes("hold"))return;
      const other=pair.bodyA.label==="hold"?pair.bodyB:pair.bodyA;
      if(!other.plugin||!other.plugin.kind)return;
      if(holding) Body.setVelocity(other,{x:other.velocity.x*1.35,y:other.velocity.y*1.35});
      else if(scene==="desk"){
        S.focus=clamp(S.focus-6,0,100); S.time+=1;
        const t=S.tasks[S.working];
        if(t&&t.open) t.prog=Math.max(0,t.prog-3);
      }
    });
  });
}
function syncHold(){
  const btn=document.getElementById("hold");
  if(!btn||!holdBody)return;
  const app=document.getElementById("app").getBoundingClientRect();
  const r=btn.getBoundingClientRect();
  Body.setPosition(holdBody,{x:r.left-app.left+r.width/2,y:r.top-app.top+r.height/2});
}
function spawnBall(text,kind){
  const {w,h}=view;
  const r=kind==="work"?34:30;
  const b=Bodies.circle(40+Math.random()*(w-80),90+Math.random()*(h*0.3),r,{
    restitution:0.98, friction:0, frictionAir:0.002, density:kind==="work"?0.003:0.0015,
    label:kind, sleepThreshold:Infinity
  });
  b.plugin={kind,text};
  Body.setVelocity(b,{x:Math.random()*3-1.5,y:Math.random()*3-1.5});
  World.add(world,b); balls.push(b);
}
function pokeBall(b){
  if(!b.plugin)return;
  Body.applyForce(b,b.position,{x:(Math.random()-.5)*0.08,y:(Math.random()-.5)*0.08});
  if(b.plugin.kind==="late"){
    S.peach++; S.time+=S.peach===1?1:Math.min(10,S.peach*2); S.focus=clamp(S.focus-5,0,100);
    if(S.peach===1) toast("Looking at the thought is the tax. Next taps cost more.");
  }else if(!S.off){
    S.interrupts++; S.time+=5+Math.floor(Math.random()*8);
    S.focus=clamp(S.focus-12,0,100); S.patience=clamp(S.patience-4,0,100);
    addTask(b.plugin.text,"interrupt");
  }
  hud();
}
function wrapLabel(text,maxW,font){
  ctx.font=font;
  const words=String(text||"").split(" ");
  const lines=[]; let line="";
  words.forEach(w=>{
    const t=line?line+" "+w:w;
    if(ctx.measureText(t).width<=maxW) line=t;
    else{ if(line) lines.push(line); line=w; }
  });
  if(line) lines.push(line);
  return lines.slice(0,3);
}
function drawWorld(){
  ctx.clearRect(0,0,view.w,view.h);
  if(scene!=="desk")return;
  balls.forEach(b=>{
    const k=b.plugin&&b.plugin.kind;
    const r=b.circleRadius;
    ctx.save();
    ctx.beginPath(); ctx.arc(b.position.x,b.position.y,r,0,Math.PI*2);
    ctx.fillStyle=k==="work"?"rgba(20,36,34,0.94)":"rgba(40,22,22,0.94)"; ctx.fill();
    ctx.strokeStyle=k==="work"?"rgba(126,200,192,0.8)":"rgba(232,160,122,0.8)"; ctx.lineWidth=2; ctx.stroke();
    ctx.clip();
    const font="10px system-ui,sans-serif";
    const lines=wrapLabel(b.plugin.text,r*1.55,font);
    ctx.fillStyle=k==="work"?"#d7efea":"#f3d2c4";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    const start=-(lines.length-1)*6;
    lines.forEach((ln,i)=>ctx.fillText(ln,b.position.x,b.position.y+start+i*12));
    ctx.restore();
  });
}
canvas.addEventListener("pointerdown",e=>{
  if(scene!=="desk")return;
  const app=document.getElementById("app").getBoundingClientRect();
  const hit=Query.point(balls,{x:e.clientX-app.left,y:e.clientY-app.top})[0];
  if(hit) pokeBall(hit);
});
function show(id){
  scene=id; holding=false;
  const st=document.getElementById("stage");
  if(id==="setup"){
    document.getElementById("hud").hidden=true;
    st.innerHTML=`<div class="kicker">ADHD desk sim</div><h1>Static</h1>
      <p>Not a diagnosis. Thoughts are bodies. They bounce. They hit the work. Looking at them costs time.</p>
